<!doctype html>
<html><head><meta charset="utf-8"><title>Ship styles</title>
<style>
  body { margin: 0; background: #03050b; color: #c9d2ea; font: 14px "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 20px; text-align: center; margin: 14px 0 4px; color: #f3c560; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 8px 14px; }
  .cell { background: radial-gradient(circle at 50% 45%, #0d1530, #02030a); border: 1px solid #1b2440; border-radius: 10px; text-align: center; padding: 4px 0 8px; }
  .cell b { display: block; font-size: 13px; }
  .sizes { display: flex; justify-content: center; align-items: flex-end; gap: 10px; padding: 0 14px 18px; }
</style></head>
<body>
<h1>Dominion of a Thousand Suns: code-drawn ship styles (medium hulls)</h1>
<div class="grid" id="grid"></div>
<h1>One race, four hull sizes (Ashkari, Kethrak, Orrun)</h1>
<div class="sizes" id="sizes"></div>
<script type="module">
  import { shipSVG } from "../src/ui/shipArt.ts";
  import { RACES } from "../src/engine/data/races.ts";
  const grid = document.getElementById("grid");
  for (const r of RACES) grid.insertAdjacentHTML("beforeend", `<div class="cell">${shipSVG(r.id, "medium", { size: 170 })}<b>${r.name}</b></div>`);
  const sizes = document.getElementById("sizes");
  for (const id of ["ashkari", "kethrak", "orrun"]) for (const h of ["small", "medium", "large", "huge"]) sizes.insertAdjacentHTML("beforeend", shipSVG(id, h, { size: 120 }));
</script>
</body></html>
